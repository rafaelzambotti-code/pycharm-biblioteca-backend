<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Livro - Biblioteca Rafael</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">

        <h1>Biblioteca Rafael</h1>
        <h2>Editar Livro</h2>

        <form action="/editar/{{ livro[0] }}" method="POST" enctype="multipart/form-data">

            <label for="nome">Nome do livro:</label>
            <input type="text" id="nome" name="nome"
                   value="{{ livro[1] }}" required>

            <label for="autor">Autor:</label>
            <input type="text" id="autor" name="autor"
                   value="{{ livro[2] }}" required>

            <label for="ano">Ano de publicação:</label>
            <input type="number" id="ano" name="ano"
                   value="{{ livro[3] }}" required>

            <label for="imagem">Imagem:</label>
            <input type="file" id="imagem" name="imagem">

            <button type="submit">Salvar alterações</button>
        </form>
        <br>
        <a href="/inicio">Cancelar</a>
    </div>
</body>
</html>
